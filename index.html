<!DOCTYPE html>
<html lang="en">
<head>
<!-- Configuración del documento y recursos de estilos. -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>calculadora</title>
<link rel="stylesheet" href="estilo.css/style.css">

</head>

<body>

<!-- Contenedor principal de la calculadora. -->
<main class="calculadora">

<!-- Encabezado con el título de la página. -->
<header class="encabezado">
<h1>calculadora</h1>
</header>


<!-- Formulario para ingresar los números y mostrar el cálculo. -->
<form id="formCalculadora">
<!-- Primer número que se usará en el cálculo. -->
<div class="campo">
<label for="numero1">
<span class="numero uno"></span> Ingrese el primer numero
</label>

<input type="number" id="numero1" required>
</div>

<!-- Segundo número que se usará en el cálculo.-->
<div class="campo">
<label for="numero2">
<span class="numero dos"></span> Ingrese
el segundo numero
</label>

<input type="number" id="numero2" required>
</div>

<!-- Envía los valores para realizar el cálculo. -->
<div class="boton-cont">
<input type="submit" value="Realizar calculo">
</div>

<!-- Área donde se presenta el resultado. -->
<section class="panel">
<h3>Resultado</h3>
<div id="resultado"></div>
</section>

</form>

</main>

<!-- Conectanos el html con javaScript -->
<script src="java.js/js.js"></script>

</body>
</html>
